<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4F1">
<meta name="description" content="比特币定投账本：记录人民币经 C2C 兑换 USDT、再买入 BTC 的全链路成本。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="定投账本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>定投账本 · ¥ → $ → ₿</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  /* 亮色 · Apple 中性灰阶 */
  --bg:#F2F2F7; --panel:#FFFFFF; --fill:#F1F1F5; --fill2:#E8E8EE;
  --line:#E6E6EB; --line-soft:#EFEFF2;
  --text:#1D1D1F; --dim:#6E6E73; --faint:#A1A1A8;
  --cny:#C4372B; --usdt:#0B7A55; --btc:#D2740A;
  --red:#D22F2A; --green:#0B8A52; --up:#D22F2A; --down:#0B8A52;
  --header:rgba(242,242,247,.8); --overlay:rgba(0,0,0,.32); --onbtc:#FFFFFF;
  --lift:0 1px 3px rgba(0,0,0,.07),0 8px 28px rgba(0,0,0,.06);
  --card:0 1px 2px rgba(0,0,0,.045),0 6px 22px rgba(0,0,0,.05); --r:20px;
  --mono:"Menlo","SF Mono","JetBrains Mono",ui-monospace,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;
}
html[data-theme="dark"]{
  --bg:#000000; --panel:#1C1C1E; --fill:#2C2C2E; --fill2:#3A3A3C;
  --line:#2A2A2E; --line-soft:#1D1D20;
  --text:#F5F5F7; --dim:#8E8E93; --faint:#5A5A60;
  --cny:#E5645A; --usdt:#30C48D; --btc:#F7931A;
  --red:#FF453A; --green:#30D158; --up:#FF453A; --down:#30D158;
  --header:rgba(0,0,0,.72); --overlay:rgba(0,0,0,.6); --onbtc:#1A1000;
  --lift:0 1px 3px rgba(0,0,0,.5),0 12px 40px rgba(0,0,0,.45); --card:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:15px; line-height:1.5; letter-spacing:-0.011em;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.lbl{font-size:12px;font-weight:500;color:var(--dim);letter-spacing:-0.005em}
.wrap{max-width:700px;margin:0 auto;padding:0 22px}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit}
input{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--btc);outline-offset:3px;border-radius:6px}
.card{background:var(--panel);border:none;border-radius:var(--r);box-shadow:var(--card);margin-bottom:12px}
.spacer{flex:1}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--faint)}
.rule{display:none}

/* ── 顶栏 ── */
header{position:sticky;top:0;z-index:40;background:var(--header);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);transition:box-shadow .25s}
header.scrolled{box-shadow:0 1px 0 var(--line-soft)}
.hbar{display:flex;align-items:center;gap:4px;height:52px;padding-top:env(safe-area-inset-top)}
.brand{font-size:15px;font-weight:600;letter-spacing:-0.02em;white-space:nowrap}
.brand b{color:var(--btc)}
.mini-px{display:flex;align-items:baseline;gap:7px;margin-left:14px;opacity:0;transform:translateY(-3px);transition:opacity .25s,transform .25s;pointer-events:none}
header.scrolled .mini-px{opacity:1;transform:none}
.mini-px b{font-family:var(--mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.mini-px i{font-style:normal;font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--dim);flex:none;transition:background .15s,color .15s}
.iconbtn:hover{background:var(--fill);color:var(--text)}
.iconbtn svg{display:block}
html[data-theme="dark"] #icoMoon,html:not([data-theme="dark"]) #icoSun{display:none}

/* ── 持仓（主角） ── */
.hero{padding:14px 0 0}
.hold{padding:26px 22px 24px}
.hold .lbl{font-size:13px}
.hold-btc{font-family:var(--mono);font-size:clamp(44px,13vw,64px);font-weight:600;color:var(--text);letter-spacing:-0.048em;line-height:.98;margin-top:14px;font-variant-numeric:tabular-nums;word-break:break-all}
.hold-fiat{font-size:14px;color:var(--dim);margin-top:16px;letter-spacing:-0.01em}
.hold-fiat span{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-0.03em;color:var(--text)}
.hold-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}
.hold-row .lbl{font-size:12px}
.hold-row b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-0.035em;margin-top:7px;font-variant-numeric:tabular-nums}

/* ── 兑换链路 ── */
.chaincard{padding:20px 22px}
.chain{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.node{position:relative;min-width:0}
.node:not(:last-child)::after{content:"";position:absolute;right:-10px;top:26px;width:5px;height:5px;border-top:1.2px solid var(--faint);border-right:1.2px solid var(--faint);transform:rotate(45deg)}
.node .cur{font-size:11.5px;font-weight:500;display:flex;align-items:center;gap:6px;margin-bottom:9px;white-space:nowrap;letter-spacing:-0.005em}
.node .cur i{width:6px;height:6px;border-radius:50%;font-style:normal;flex:none}
.node .amt{font-family:var(--mono);font-size:clamp(15px,4.3vw,18px);font-weight:600;letter-spacing:-0.035em;line-height:1.2;font-variant-numeric:tabular-nums;word-break:break-all}
.n-cny .cur{color:var(--cny)} .n-cny .cur i{background:var(--cny)}
.n-usdt .cur{color:var(--usdt)} .n-usdt .cur i{background:var(--usdt)}
.n-btc .cur{color:var(--btc)} .n-btc .cur i{background:var(--btc)}
.chainfoot{display:flex;justify-content:space-between;gap:12px;margin-top:20px;font-size:12.5px;color:var(--text)}
.chainfoot em{font-style:normal;color:var(--dim);margin-right:6px}
.chainfoot span{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.chainfoot span em{font-family:var(--sans);letter-spacing:-0.005em}

/* ── 行情 ── */
.pricebar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 22px;cursor:pointer}
.pb-l .lbl{margin-bottom:9px;font-size:12.5px}
.pb-l .big{font-family:var(--mono);font-size:clamp(26px,7vw,32px);font-weight:600;letter-spacing:-0.042em;line-height:1;font-variant-numeric:tabular-nums}
.pb-l .cnyeq{font-size:12px;color:var(--dim);margin-top:10px;font-family:var(--sans);letter-spacing:-0.005em}
.pb-r{display:flex;flex-direction:column;align-items:flex-end;gap:9px;text-align:right}
.pb-r .vs{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.035em}
.pb-r .vs small{display:block;font-family:var(--sans);font-size:12px;font-weight:400;color:var(--dim);margin-bottom:5px;letter-spacing:-0.005em}
.pb-r .status{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--faint)}
.pb-r .rf{padding:4px 11px;border-radius:99px;background:var(--fill);color:var(--dim)}
.pricebar:hover .rf{background:var(--fill2);color:var(--text)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--down);flex:none}
.dot.stale{background:var(--faint)}
.dot.load{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}

/* ── 控件 ── */
.toolbar{display:flex;align-items:center;gap:10px;margin:22px 0 14px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{font-size:12.5px;font-weight:500;padding:6px 13px;border-radius:8px;color:var(--dim);white-space:nowrap;transition:.18s}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.09)}
html[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--fill2);box-shadow:none}
.btn{font-size:13px;font-weight:500;padding:9px 17px;border-radius:99px;background:var(--fill);color:var(--text);white-space:nowrap;transition:.18s}
.btn:hover{background:var(--fill2)}
.btn.primary{background:var(--btc);color:var(--onbtc);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:transparent;color:var(--red);padding-left:0}
.btn.danger:hover{background:transparent;opacity:.7}
.cadence{font-size:12px;color:var(--faint)}
.cadence b{font-family:var(--mono);font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums}
.cadence.due b{color:var(--btc)}

/* ── 图表 ── */
.chartbox{padding:16px 16px 18px}
.chartwrap{position:relative;height:220px;touch-action:pan-y;margin:0 -6px}
canvas{display:block;width:100%;height:100%}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px}
.lg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.lg s{width:14px;height:2.5px;border-radius:2px;text-decoration:none;flex:none}
.note{font-size:12px;color:var(--faint);margin-top:12px;line-height:1.6;letter-spacing:-0.005em}

/* ── 表单 ── */
.form{padding:22px;display:none}
.form.open{display:block;animation:rise .32s cubic-bezier(.22,.9,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.form h3{margin:0 0 20px;font-size:19px;font-weight:600;letter-spacing:-0.025em}
.fchain{display:grid;gap:22px}
.f{display:flex;flex-direction:column;gap:8px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:12.5px;color:var(--dim);display:flex;justify-content:space-between;align-items:center;gap:8px}
.f label em{font-style:normal;color:var(--faint);font-size:12px}
.f input{background:var(--fill);border:1px solid transparent;border-radius:12px;padding:13px 14px;font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-0.03em;width:100%;transition:.16s}
.f input:focus{border-color:var(--btc);background:var(--panel);outline:none}
.f input::placeholder{color:var(--faint);letter-spacing:-0.01em}
.f input[type="date"]{-webkit-appearance:none;appearance:none;font-family:var(--sans);font-size:15px;letter-spacing:-0.01em;text-align:left;min-width:0;height:47px;line-height:1.2}
.f input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0;padding:0}
.f input[type="date"]::-webkit-calendar-picker-indicator{opacity:.35;margin-left:auto}
.f.auto input{color:var(--dim)}
.f.auto label em{color:var(--btc)}
.grp{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;min-width:0}
.grp .gt{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.01em}
.factions{display:flex;gap:10px;margin-top:24px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.hint{font-size:12px;color:var(--faint);margin-right:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-0.02em}

/* ── 流水 ── */
.ledger{padding:14px 20px 8px}
.lhead{display:grid;grid-template-columns:66px 1fr 1fr 1fr 1fr 1.15fr 64px;gap:8px;padding:0 0 10px}
.lhead span{font-size:11px;color:var(--faint)}
.lhead span:not(:first-child){text-align:right}
.yr{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:14px 0 12px;text-align:left;border-top:1px solid var(--line-soft)}
.yr .y{font-size:14px;font-weight:600;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px}
.yr .y .cv{color:var(--faint);font-size:9px;transition:transform .2s;display:inline-block}
.yr[aria-expanded="false"] .cv{transform:rotate(-90deg)}
.yr .s{font-size:12px;color:var(--dim);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.row{display:grid;grid-template-columns:66px 1fr 1fr 1fr 1fr 1.15fr 64px;gap:8px;padding:12px 10px;margin:0 -10px;align-items:center;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:-0.03em;cursor:pointer;width:calc(100% + 20px);text-align:left;border-radius:12px;transition:background .14s}
.row:hover{background:var(--fill)}
.row .d{color:var(--dim);font-size:12px}
.row .r{text-align:right}
.c-cny{color:var(--cny)} .c-usdt{color:var(--usdt)} .c-btc{color:var(--btc)}
.row .mini{display:none}
.empty{padding:44px 0 48px;text-align:center}
.empty h4{margin:0 0 8px;font-size:19px;font-weight:600;letter-spacing:-0.025em}
.empty p{color:var(--dim);font-size:14px;margin:0 auto 22px;max-width:340px;line-height:1.6}

/* ── 弹层 ── */
.modal{position:fixed;inset:0;z-index:60;background:var(--overlay);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--panel);border-radius:20px;width:100%;max-width:400px;padding:26px 24px 20px;max-height:86vh;overflow:auto;box-shadow:var(--lift);animation:pop .3s cubic-bezier(.22,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.sheet h3{margin:0 0 18px;font-size:20px;font-weight:600;letter-spacing:-0.03em}
.srow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line-soft)}
.srow:last-of-type{border-bottom:none}
.srow .k{font-size:15px;letter-spacing:-0.01em}
.srow .k small{display:block;color:var(--faint);font-size:12px;margin-top:3px;line-height:1.45;letter-spacing:-0.005em}
.srow input{background:var(--fill);border:1px solid transparent;border-radius:10px;padding:9px 11px;font-family:var(--mono);font-size:15px;width:118px;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.srow input:focus{border-color:var(--btc);outline:none}
.bstate{font-size:13px;color:var(--dim);margin:0;letter-spacing:-0.005em}
.bstate.warn{color:var(--btc)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 4px}
.dgrid .btn{padding:12px 10px;text-align:center}
.dman{border-top:1px solid var(--line-soft);margin-top:16px}
.dman summary{font-size:13px;color:var(--dim);cursor:pointer;padding:14px 0;list-style:none;user-select:none}
.dman summary::-webkit-details-marker{display:none}
.dman summary::before{content:"›";margin-right:9px;display:inline-block;transition:transform .2s;color:var(--faint)}
.dman[open] summary::before{transform:rotate(90deg)}
textarea{width:100%;height:180px;background:var(--fill);border:1px solid transparent;border-radius:12px;color:var(--text);font-family:var(--mono);font-size:12px;padding:13px;resize:vertical;line-height:1.55;letter-spacing:-0.02em}
textarea:focus{border-color:var(--btc);outline:none}
footer{text-align:center;padding:10px 0 34px}
footer span{font-size:11.5px;color:var(--faint)}

/* ── 提示 ── */
.toast{position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);background:var(--panel);border-radius:99px;padding:11px 12px 11px 20px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .26s,transform .26s cubic-bezier(.22,.9,.3,1);z-index:80;display:flex;align-items:center;gap:14px;box-shadow:var(--lift);max-width:calc(100vw - 36px);letter-spacing:-0.01em}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{font-size:13px;font-weight:600;color:var(--btc);padding:5px 13px;border-radius:99px;background:var(--fill)}
.toast .msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.plain{padding-right:20px}

@media(max-width:680px){
  .wrap{padding:0 14px}
  .chain{gap:14px}
  .node:not(:last-child)::after{right:-8px;top:24px}
  .pb-r{flex-direction:row;align-items:center;justify-content:space-between;width:100%;text-align:left;margin-top:18px}
  .pb-r .vs small{margin-bottom:3px}
  .lhead{display:none}
  .row{grid-template-columns:1fr auto;gap:5px 12px;padding:14px 10px}
  .row:hover{background:transparent}
  .row .d{text-align:left;grid-row:1;grid-column:1}
  .row .hide-m{display:none}
  .row .mini{display:block;grid-column:1/-1;grid-row:2;font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.75}
  .row .pnl{grid-row:1;grid-column:2;text-align:right}
  .cadence{width:100%;order:9}
  .hold{padding:24px 18px 22px}
  .chaincard{padding:18px}
  .pricebar{padding:18px}
  .form{padding:18px}
  .chartbox{padding:14px 12px 16px}
  .ledger{padding:12px 16px 6px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header id="hdr">
  <div class="wrap hbar">
    <div class="brand">定投账本 <b>₿</b></div>
    <div class="mini-px" id="miniPx"><b id="mPx">—</b><i id="mVs" class="flat">—</i></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnTheme" title="切换深浅主题" aria-label="切换深浅主题">
      <svg id="icoMoon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M20.5 14.4A8.6 8.6 0 0 1 9.6 3.5 8.6 8.6 0 1 0 20.5 14.4Z"/></svg>
      <svg id="icoSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2.1M12 19.1v2.1M4.9 12H2.8M21.2 12h-2.1M6.9 6.9 5.4 5.4M18.6 18.6l-1.5-1.5M17.1 6.9l1.5-1.5M5.4 18.6l1.5-1.5"/></svg>
    </button>
    <button class="iconbtn" id="btnSettings" title="设置" aria-label="设置">⚙</button>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <div class="card hold">
      <div class="lbl">当前持仓</div>
      <div class="hold-btc" id="holdBtc">₿0</div>
      <div class="hold-fiat" id="holdFiat">还没有记录</div>
      <div class="hold-row">
        <div><span class="lbl" id="lPnl">浮动盈亏</span><b class="flat" id="sPnl">—</b></div>
        <div><span class="lbl">收益率</span><b class="flat" id="sRoi">—</b></div>
        <div><span class="lbl" id="lIrr">年化 IRR</span><b class="flat" id="sIrr">—</b></div>
      </div>
    </div>

    <div class="card chaincard">
      <div class="chain">
        <div class="node n-cny"><div class="cur"><i></i>CNY 人民币</div><div class="amt" id="hCny">¥0</div></div>
        <div class="node n-usdt"><div class="cur"><i></i>USDT 稳定币</div><div class="amt" id="hUsdt">$0</div></div>
        <div class="node n-btc"><div class="cur"><i></i>BTC 比特币</div><div class="amt" id="hBtc">₿0</div></div>
      </div>
      <div class="chainfoot">
        <span id="hRate"><em>C2C 均价</em> —</span>
        <span id="hCost"><em>持仓均价</em> —</span>
      </div>
    </div>

    <div class="card pricebar" id="tick" title="点击刷新行情">
      <div class="pb-l">
        <div class="lbl">BTC / USDT 现价</div>
        <div class="big num" id="px">—</div>
        <div class="cnyeq num" id="pxCny">点击刷新</div>
      </div>
      <div class="pb-r">
        <div class="vs num flat" id="pxVs"><small>较持仓均价</small>—</div>

<script>
"use strict";

/* ═══════════ 存储 ═══════════
   Claude 环境用 window.storage；GitHub Pages 等自托管场景回退 localStorage。 */
const KEY = "btc-dca-ledger";
const store = {
  async load(){
    try{
      if (window.storage){ const r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; }
      const raw = window.localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  },
  async save(o){
    try{
      const s = JSON.stringify(o);
      if (window.storage){ await window.storage.set(KEY, s); return true; }
      window.localStorage.setItem(KEY, s); return true;
    }catch(e){ return false; }
  }
};

/* ═══════════ 状态 ═══════════ */
let state = { records: [], settings: { fx: 7.25, base: "CNY", manualPx: null, manualFx: null, redUp: true, theme: "light", lastBackup: null } };
let price = { v: null, src: "—", live: false };
let fxInfo = { src: "默认值", live: false };
let editingId = null, chartTab = "stack", collapsed = {}, hoverX = null;

const $ = s => document.querySelector(s);
const num = v => { const n = parseFloat(String(v).replace(/[,\s¥$₮₿]/g,"")); return isFinite(n) ? n : NaN; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const DAY = 864e5;

/* ═══════════ 格式 ═══════════ */
const fmt = (n,d=2) => !isFinite(n) ? "—" : n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtK = n => { if(!isFinite(n)) return "—"; const a=Math.abs(n);
  if (a>=1e8) return (n/1e8).toFixed(2)+"亿";
  if (a>=1e4) return (n/1e4).toFixed(a>=1e6?1:2)+"万";
  return fmt(n, a<100?2:0); };
const cny  = n => "¥"+fmtK(n);
const usdt = n => "$"+fmtK(n);
const pct  = n => isFinite(n) ? (n>=0?"+":"")+(n*100).toFixed(2)+"%" : "—";
const sats = n => Math.round(n*1e8).toLocaleString("en-US");

/* ═══════════ 汇总 ═══════════ */
function calc(){
  const r = state.records.slice().sort((a,b)=> a.date<b.date ? -1 : 1);
  const s = { n:r.length, cny:0, usdt:0, btc:0, list:r };
  r.forEach(x=>{ s.cny+=x.cny; s.usdt+=x.usdt; s.btc+=x.btc; });
  s.avgRate = s.usdt ? s.cny/s.usdt : NaN;
  s.costU   = s.btc  ? s.usdt/s.btc : NaN;
  s.costC   = s.btc  ? s.cny /s.btc : NaN;
  s.px   = price.v;
  s.valU = isFinite(s.px) ? s.btc*s.px : NaN;
  s.valC = isFinite(s.valU) ? s.valU*state.settings.fx : NaN;
  s.pnlU = s.valU - s.usdt;  s.pnlC = s.valC - s.cny;
  s.roiU = s.usdt ? s.pnlU/s.usdt : NaN;
  s.roiC = s.cny  ? s.pnlC/s.cny  : NaN;
  s.irr  = irr(r, s);
  return s;
}
function irr(r, s){
  if (!r.length || !isFinite(s.valU)) return NaN;
  const useCny = state.settings.base === "CNY";
  const f = r.map(x=>({ t:new Date(x.date).getTime(), v:-(useCny?x.cny:x.usdt) }));
  f.push({ t:Date.now(), v: useCny ? s.valC : s.valU });
  const t0=f[0].t, Y=365.25*DAY;
  const npv = k => f.reduce((a,x)=> a + x.v/Math.pow(1+k,(x.t-t0)/Y), 0);
  let lo=-0.9999, hi=20;
  if (npv(lo)*npv(hi) > 0) return NaN;
  for (let i=0;i<160;i++){ const m=(lo+hi)/2; if (npv(m)>0) lo=m; else hi=m; }
  const o=(lo+hi)/2; return Math.abs(o)>19 ? NaN : o;
}

/* ═══════════ 渲染 ═══════════ */
function render(){
  const s = calc(), isCny = state.settings.base === "CNY";
  const cs = getComputedStyle(document.documentElement);
  const RED = cs.getPropertyValue("--red").trim(), GREEN = cs.getPropertyValue("--green").trim();
  document.documentElement.style.setProperty("--up",   state.settings.redUp ? RED : GREEN);
  document.documentElement.style.setProperty("--down", state.settings.redUp ? GREEN : RED);

  /* 主卡：持仓为唯一主角 */
  $("#holdBtc").textContent = "₿" + (s.btc ? s.btc.toFixed(6) : "0");
  $("#holdFiat").innerHTML = s.n
    ? (isFinite(s.valU)
        ? `<span>${usdt(s.valU)}</span> · <span>${cny(s.valC)}</span> &nbsp;汇率 <span>${state.settings.fx}</span>${fxInfo.live ? "" : " ⚠"}`
        : `<span>${sats(s.btc)}</span> sats · 等待行情`)
    : "还没有记录";

  /* 链路：钱怎么走到币的上下文 */
  $("#hCny").textContent  = cny(s.cny);
  $("#hUsdt").textContent = usdt(s.usdt);
  $("#hBtc").textContent  = "₿" + (s.btc ? s.btc.toFixed(6) : "0");
  $("#hRate").innerHTML = `<em>C2C 均价</em> ${isFinite(s.avgRate) ? "¥"+s.avgRate.toFixed(4) : "—"}`;
  $("#hCost").innerHTML = `<em>持仓均价</em> ${isFinite(s.costU) ? (isCny ? "¥"+fmtK(s.costC) : "$"+fmt(s.costU,0)) : "—"}`;

  const pnl = isCny?s.pnlC:s.pnlU, roi = isCny?s.roiC:s.roiU;
  const eP=$("#sPnl"), eR=$("#sRoi"), eI=$("#sIrr");
  eP.textContent = isFinite(pnl) ? (pnl>=0?"+":"−")+(isCny?"¥":"$")+fmtK(Math.abs(pnl)) : "—";
  eR.textContent = pct(roi);
  eI.textContent = pct(s.irr);
  [[eP,pnl],[eR,roi],[eI,s.irr]].forEach(([el,v])=> el.className = "num " + (!isFinite(v)?"flat":v>=0?"up":"down"));
  $("#lPnl").textContent = isCny ? "浮动盈亏 · ¥" : "浮动盈亏 · $";
  $("#lIrr").textContent = isCny ? "年化 IRR · ¥" : "年化 IRR · $";

  const vs = $("#pxVs"), mv = $("#mVs");
  if (isFinite(s.costU) && isFinite(s.px)){
    const d = (s.px - s.costU)/s.costU, k = d>=0 ? "up" : "down";
    vs.innerHTML = `<small>较持仓均价</small>${pct(d)}`; vs.className = "vs num "+k;
    mv.textContent = pct(d); mv.className = k;
  } else {
    vs.innerHTML = `<small>较持仓均价</small>—`; vs.className = "vs num flat";
    mv.textContent = "—"; mv.className = "flat";
  }
  $("#mPx").textContent = price.v ? fmt(price.v,0) : "—";

  renderCadence(s);
  renderRows(s);
  drawChart(s);
}

function renderCadence(s){
  const el = $("#cadence");
  if (!s.n){ el.textContent = ""; el.className = "cadence"; return; }
  const last = new Date(s.list[s.list.length-1].date).getTime();
  const since = Math.max(0, Math.floor((Date.now()-last)/DAY));
  let gap = "";
  if (s.n > 1){
    const span = (last - new Date(s.list[0].date).getTime())/DAY;
    gap = ` · 平均间隔 ${Math.round(span/(s.n-1))} 天`;
  }
  el.textContent = `距上次定投 ${since} 天${gap}`;
  el.className = "cadence" + (since >= 32 ? " due" : "");
  el.innerHTML = el.textContent.replace(/(\d+) 天/, "<b>$1 天</b>");
}

function renderRows(s){
  const box = $("#rows");
  if (!s.n){
    box.innerHTML = `<div class="empty">
      <h4>还没有记录</h4>
      <p>每一笔定投都是一条链：人民币换成稳定币，稳定币买入比特币。两段都记下来，成本才算得清。</p>
      <button type="button" class="btn primary" id="emptyAdd">记第一笔</button>
    </div>`;
    $("#emptyAdd").addEventListener("click", ()=> openForm(null));
    return;
  }
  const years = {};
  s.list.slice().reverse().forEach(r => { (years[r.date.slice(0,4)] ||= []).push(r); });
  let html = "";
  for (const y of Object.keys(years).sort().reverse()){
    const rs = years[y], open = !collapsed[y];
    const yc = rs.reduce((a,x)=>a+x.cny,0), yb = rs.reduce((a,x)=>a+x.btc,0);
    html += `<button type="button" class="yr" data-yr="${y}" aria-expanded="${open}">
      <span class="y"><span class="cv">▾</span>${y}</span>
      <span class="s">${rs.length} 笔 · ${cny(yc)} · ₿${yb.toFixed(6)}</span></button>`;
    if (!open) continue;
    for (const r of rs){
      const p = isFinite(s.px) ? (s.px-r.price)/r.price : NaN;
      const k = !isFinite(p) ? "flat" : p>=0 ? "up" : "down";
      html += `<button type="button" class="row" data-id="${r.id}">
        <span class="d">${r.date.slice(2)}</span>
        <span class="r c-cny hide-m">¥${fmt(r.cny,0)}</span>
        <span class="r hide-m" style="color:var(--dim)">${r.rate.toFixed(3)}</span>
        <span class="r c-usdt hide-m">${fmt(r.usdt,2)}</span>
        <span class="r hide-m" style="color:var(--dim)">${fmt(r.price,0)}</span>
        <span class="r c-btc hide-m">${r.btc.toFixed(6)}</span>
        <span class="r pnl ${k}">${pct(p)}</span>
        <span class="mini"><span class="c-cny">¥${fmt(r.cny,0)}</span> <span style="color:var(--faint)">→</span> <span class="c-usdt">${fmt(r.usdt,2)}$</span> <span style="color:var(--faint)">→</span> <span class="c-btc">₿${r.btc.toFixed(6)}</span><br><span style="color:var(--faint)">C2C ${r.rate.toFixed(3)} · BTC ${fmt(r.price,0)}${r.note ? " · "+esc(r.note) : ""}</span></span>
      </button>`;
    }
  }
  box.innerHTML = html;
}
const esc = t => String(t).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

/* ═══════════ 图表 ═══════════ */
const cv = $("#cv"), ctx = cv.getContext("2d");
let marks = [];

function drawChart(s){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const cs = getComputedStyle(document.documentElement), C = k => cs.getPropertyValue(k).trim();
  const padR = W < 420 ? 42 : 52;
  const x0 = 4, x1 = W - padR, y0 = 14, y1 = H - 20;
  marks = [];

  if (!s.n || (!isFinite(s.px) && chartTab !== "stack")){
    ctx.fillStyle = C("--faint"); ctx.font = "11px "+C("--mono"); ctx.textAlign = "center";
    ctx.fillText(s.n ? "等待 BTC 行情" : "记录后显示图表", W/2, H/2);
    $("#legend").innerHTML = ""; $("#chartNote").textContent = ""; return;
  }

  const isCny = state.settings.base === "CNY", K = isCny ? state.settings.fx : 1, U = isCny ? "¥" : "$";
  const t0 = new Date(s.list[0].date).getTime(), tN = Date.now();
  const span = Math.max(tN - t0, DAY);
  const X = t => x0 + (t-t0)/span*(x1-x0);
  const grid = (lo,hi,f) => {
    ctx.font = "10px "+C("--mono"); ctx.textAlign = "left"; ctx.textBaseline = "middle";
    for (let i=0;i<=3;i++){
      const v = lo+(hi-lo)*i/3, y = y1-(i/3)*(y1-y0);
      ctx.strokeStyle = C("--line-soft"); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0,y+.5); ctx.lineTo(x1,y+.5); ctx.stroke();
      ctx.fillStyle = C("--faint"); ctx.fillText(f(v), x1+7, y);
    }
  };
  const axisX = () => {
    ctx.font = "10px "+C("--mono"); ctx.fillStyle = C("--faint"); ctx.textBaseline = "top";
    ctx.textAlign = "left";  ctx.fillText(s.list[0].date.slice(2,7), x0, y1+6);
    ctx.textAlign = "right"; ctx.fillText("现在", x1, y1+6);
  };

  if (chartTab === "stack"){
    let cb = 0; const pts = [];
    for (const r of s.list){
      const t = new Date(r.date).getTime();
      pts.push([t,cb]); cb += r.btc; pts.push([t,cb]);
      marks.push({ x:X(t), v:cb, t, title:r.date,
        lines:[["本笔","₿"+r.btc.toFixed(6)],["累计","₿"+cb.toFixed(6)],["占比",((r.btc/s.btc)*100).toFixed(1)+"%"]] });
    }
    pts.push([tN,cb]);
    const hi = cb*1.12, Y = v => y1 - v/(hi||1)*(y1-y0);
    marks.forEach(m => m.y = Y(m.v));
    grid(0, hi, v => v>=1 ? "₿"+v.toFixed(2) : (v*1e8/1e3).toFixed(0)+"k sat");

    const g = ctx.createLinearGradient(0,y0,0,y1);
    g.addColorStop(0, C("--btc")+"44"); g.addColorStop(1, C("--btc")+"03");
    ctx.beginPath(); ctx.moveTo(X(pts[0][0]), y1);
    pts.forEach(p=> ctx.lineTo(X(p[0]),Y(p[1]))); ctx.lineTo(X(tN),y1); ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
    ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));
    ctx.strokeStyle = C("--btc"); ctx.lineWidth = 2; ctx.stroke();
    marks.forEach(m=>{ ctx.beginPath(); ctx.arc(m.x,m.y,2.4,0,7); ctx.fillStyle=C("--btc"); ctx.fill(); });
    axisX();

    const days = Math.max(1,(tN-t0)/DAY), mo = days/30.44;
    $("#legend").innerHTML =
      `<span class="lg"><s style="background:${C("--btc")}"></s>累计 ₿${cb.toFixed(8)}</span>
       <span class="lg">${sats(cb)} sats</span>
       <span class="lg">单笔均 ₿${(cb/s.n).toFixed(6)}</span>`;
    $("#chartNote").textContent = `${mo.toFixed(1)} 个月 ${s.n} 笔，平均每月攒 ₿${(cb/mo).toFixed(6)}。这条线只由买入行为决定，与币价无关——定投里唯一完全可控的变量。`;
  }

  else if (chartTab === "cost"){
    let cum = 0, cb = 0; const inv = [], val = [];
    for (const r of s.list){
      const t = new Date(r.date).getTime();
      inv.push([t,cum]); cb += r.btc; cum += isCny ? r.cny : r.usdt; inv.push([t,cum]);
      const v = cb*r.price*K;
      val.push([t,v]);
      marks.push({ x:X(t), v, t, title:r.date,
        lines:[["投入",U+fmtK(cum)],["市值",U+fmtK(v)],["盈亏",pct(v/cum-1)]] });
    }
    inv.push([tN,cum]);
    const vNow = s.btc*s.px*K; val.push([tN,vNow]);
    marks.push({ x:X(tN), v:vNow, t:tN, title:"现在",
      lines:[["投入",U+fmtK(cum)],["市值",U+fmtK(vNow)],["盈亏",pct(vNow/cum-1)]] });
    const hi = Math.max(...inv.concat(val).map(p=>p[1]))*1.1;
    const Y = v => y1 - v/(hi||1)*(y1-y0);
    marks.forEach(m => m.y = Y(m.v));
    grid(0, hi, v => U+fmtK(v));

    const col = vNow >= cum ? C("--up") : C("--down");
    const g = ctx.createLinearGradient(0,y0,0,y1);
    g.addColorStop(0, col+"36"); g.addColorStop(1, col+"02");
    ctx.beginPath(); ctx.moveTo(X(val[0][0]),Y(val[0][1]));
    val.forEach(p=>ctx.lineTo(X(p[0]),Y(p[1]))); ctx.lineTo(X(tN),y1); ctx.lineTo(X(val[0][0]),y1);
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();

    ctx.beginPath(); inv.forEach((p,i)=> i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));
    ctx.strokeStyle = C("--dim"); ctx.lineWidth = 1.4; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); val.forEach((p,i)=> i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.stroke();
    ctx.beginPath(); ctx.arc(X(tN),Y(vNow),3.4,0,7); ctx.fillStyle = col; ctx.fill();
    axisX();
    $("#legend").innerHTML =
      `<span class="lg"><s style="background:${C("--dim")}"></s>累计投入</span>
       <span class="lg"><s style="background:${col}"></s>持仓市值</span>`;
    $("#chartNote").textContent = "市值按每笔买入当日价与当前价采样，两点间为直线连接，不是逐日真实走势。";
  }

  else {
    const arr = s.list.map(r=>r.price*K).concat([s.px*K, s.costU*K]);
    const hi = Math.max(...arr)*1.08, lo = Math.min(...arr)*0.92;
    const Y = v => y1 - (v-lo)/(hi-lo||1)*(y1-y0);
    grid(lo, hi, v => U+fmtK(v));
    const maxA = Math.max(...s.list.map(r=>r.cny));
    ctx.beginPath(); ctx.moveTo(x0,Y(s.costU*K)); ctx.lineTo(x1,Y(s.costU*K));
    ctx.strokeStyle = C("--btc"); ctx.lineWidth = 1.4; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
    const col = s.px >= s.costU ? C("--up") : C("--down");
    ctx.beginPath(); ctx.moveTo(x0,Y(s.px*K)); ctx.lineTo(x1,Y(s.px*K));
    ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.stroke();
    s.list.forEach(r=>{
      const t = new Date(r.date).getTime(), rad = 2.6+3.4*Math.sqrt(r.cny/maxA);
      const x = X(t), y = Y(r.price*K);
      ctx.beginPath(); ctx.arc(x,y,rad,0,7);
      ctx.fillStyle = C("--btc") + (r.price<=s.costU ? "E6" : "50"); ctx.fill();
      ctx.strokeStyle = C("--panel"); ctx.lineWidth = 1.2; ctx.stroke();
      marks.push({ x, y, v:r.price*K, t, title:r.date,
        lines:[["成交价",U+fmtK(r.price*K)],["投入","¥"+fmt(r.cny,0)],["买到","₿"+r.btc.toFixed(6)]] });
    });
    axisX();
    const below = s.list.filter(r=>r.price<=s.costU).length;
    $("#legend").innerHTML =
      `<span class="lg"><s style="background:${C("--btc")}"></s>单笔成交（面积＝投入额）</span>
       <span class="lg"><s style="background:${C("--btc")};opacity:.55"></s>持仓均价 ${U+fmtK(s.costU*K)}</span>
       <span class="lg"><s style="background:${col}"></s>当前价</span>`;
    $("#chartNote").textContent = `${below}/${s.n} 笔买在均价之下（实心点），这部分决定了均价被拉低多少。`;
  }

  drawHover(C, y0, y1, W);
}

function drawHover(C, y0, y1, W){
  if (hoverX == null || !marks.length) return;
  let m = marks[0];
  for (const k of marks) if (Math.abs(k.x-hoverX) < Math.abs(m.x-hoverX)) m = k;
  if (Math.abs(m.x-hoverX) > 60) return;

  ctx.strokeStyle = C("--faint"); ctx.lineWidth = 1; ctx.setLineDash([2,3]);
  ctx.beginPath(); ctx.moveTo(m.x, y0-8); ctx.lineTo(m.x, y1); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(m.x, m.y, 4.5, 0, 7); ctx.fillStyle = C("--btc"); ctx.fill();
  ctx.strokeStyle = C("--panel"); ctx.lineWidth = 2; ctx.stroke();

  const mono = C("--mono");
  ctx.font = "600 10px "+mono;
  let w = ctx.measureText(m.title).width;
  ctx.font = "10px "+mono;
  m.lines.forEach(l => { w = Math.max(w, ctx.measureText(l[0]).width + ctx.measureText(l[1]).width + 16); });
  const bw = w+18, bh = 20 + m.lines.length*14;
  let bx = m.x + 12; if (bx + bw > W-2) bx = m.x - bw - 12; if (bx < 2) bx = 2;
  let by = Math.min(Math.max(m.y - bh/2, 2), y1 - bh);

  ctx.fillStyle = C("--panel"); ctx.strokeStyle = C("--line"); ctx.lineWidth = 1;
  if (ctx.roundRect){ ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,8); ctx.fill(); ctx.stroke(); }
  else { ctx.fillRect(bx,by,bw,bh); ctx.strokeRect(bx,by,bw,bh); }

  ctx.textBaseline = "middle"; ctx.textAlign = "left";
  ctx.font = "600 10px "+mono; ctx.fillStyle = C("--text");
  ctx.fillText(m.title, bx+9, by+13);
  ctx.font = "10px "+mono;
  m.lines.forEach((l,i)=>{
    const y = by+29+i*14;
    ctx.fillStyle = C("--faint"); ctx.textAlign = "left";  ctx.fillText(l[0], bx+9, y);
    ctx.fillStyle = C("--text");  ctx.textAlign = "right"; ctx.fillText(l[1], bx+bw-9, y);
  });
  ctx.textAlign = "left";
}

/* USD/CNY 官方汇率。注意：币安 C2C 的 USDT 价通常带 0.5%~2% 溢价，
   且无公开接口，这里取到的只作人民币本位估值用。 */
const FX_SOURCES = [
  ["Frankfurter","https://api.frankfurter.app/latest?from=USD&to=CNY", d=>+d.rates.CNY],
  ["Currency-API","https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json", d=>+d.usd.cny],
  ["Currency-API","https://latest.currency-api.pages.dev/v1/currencies/usd.json", d=>+d.usd.cny],

let fxing = false;
async function fetchFx(){
  if (fxing) return; fxing = true;
  if (state.settings.manualFx > 0){
    state.settings.fx = state.settings.manualFx;
    fxInfo = { src:"手动设定", live:false }; fxing = false; return;
  }
  for (const [name,url,pick] of FX_SOURCES){
    try{
      const c = new AbortController(), tm = setTimeout(()=>c.abort(), 6000);
      const res = await fetch(url,{signal:c.signal}); clearTimeout(tm);
      if (!res.ok) continue;
      const v = pick(await res.json());
      if (v > 3 && v < 20){
        state.settings.fx = +v.toFixed(4);
        fxInfo = { src:name, live:true };
        await persist(); fxing = false; return;
      }
    }catch(e){}
  }
  if (!fxInfo.live) fxInfo = { src:"取不到，用上次的值", live:false };
  fxing = false;
}

let fetching = false;
async function fetchPrice(){
  if (fetching) return; fetching = true;
  $("#dot").classList.add("load");
  if (isFinite(state.settings.manualPx) && state.settings.manualPx > 0){
    price = { v: state.settings.manualPx, src: "手动设定", live: false };
  } else {
    let got = false;
    for (const [name,url,pick] of SOURCES){
      try{
        const c = new AbortController(), tm = setTimeout(()=>c.abort(), 6000);
        const res = await fetch(url,{signal:c.signal}); clearTimeout(tm);
        if (!res.ok) continue;
        const v = pick(await res.json());
        if (isFinite(v) && v>0){ price = { v, src:name, live:true }; got = true; break; }
      }catch(e){}
    }
    if (!got) price = { v: price.v, src: price.v ? price.src : "行情不可用", live: false };
  }
  $("#dot").classList.remove("load");
  fetching = false; paintTick(); render();
}

  $("#pxCny").textContent = price.v ? `≈ ¥${fmt(price.v*state.settings.fx,0)} · 汇率 ${state.settings.fx}${fxInfo.live ? "" : " ·手动"}` : "点击刷新";

const F = { d:$("#fDate"), c:$("#fCny"), r:$("#fRate"), u:$("#fUsdt"), p:$("#fPrice"), b:$("#fBtc"), n:$("#fNote") };

/* 每一段三个数只需填两个，第三个自动算。
   d1: 第一段中由程序推出的那个（"usdt" 或 "rate"）
   d2: 第二段中由程序推出的那个（"btc"  或 "price"） */
let d1 = "usdt", d2 = "btc", loading = false;
const HINT = { rate:"¥/USDT", usdt:"到账数量", price:"USDT", btc:"到账数量" };

function calcLeg1(){
  const c=num(F.c.value), r=num(F.r.value), u=num(F.u.value);
  if (d1 === "usdt"){ if (c>0 && r>0) F.u.value = (c/r).toFixed(2); }
  else              { if (c>0 && u>0) F.r.value = (c/u).toFixed(4); }
}
function calcLeg2(){
  const u=num(F.u.value), p=num(F.p.value), b=num(F.b.value);
  if (d2 === "btc"){ if (u>0 && p>0) F.b.value = (u/p).toFixed(8); }
  else             { if (u>0 && b>0) F.p.value = (u/b).toFixed(2); }
}
function markAuto(){
  const set = (el,key,on)=>{
    el.closest(".f").classList.toggle("auto", on);
    $("#em"+key[0].toUpperCase()+key.slice(1)).textContent = on ? "自动算出" : HINT[key];
  };
  set(F.r,"rate",  d1==="rate");
  set(F.u,"usdt",  d1==="usdt");
  set(F.p,"price", d2==="price");
  set(F.b,"btc",   d2==="btc");
}
function recalc(){ if (loading) return; calcLeg1(); calcLeg2(); markAuto(); refreshHint(); }

F.c.addEventListener("input", recalc);
F.r.addEventListener("input", ()=>{ d1 = "usdt"; recalc(); });
F.u.addEventListener("input", ()=>{ d1 = "rate"; recalc(); });
F.p.addEventListener("input", ()=>{ d2 = "btc";   recalc(); });
F.b.addEventListener("input", ()=>{ d2 = "price"; recalc(); });

function refreshHint(){
  const c=num(F.c.value), b=num(F.b.value), u=num(F.u.value), r=num(F.r.value);
  const parts = [];
  if (c>0 && b>0) parts.push(`折合 ¥${fmt(c/b,0)}/枚`);
  if (b>0) parts.push(`${sats(b)} sats`);
  if (c>0 && u>0 && state.settings.fx>0){
    const prem = (c/u)/state.settings.fx - 1;
    if (Math.abs(prem) > 0.0005) parts.push(`C2C 溢价 ${(prem*100).toFixed(2)}%`);
  }
  $("#fHint").textContent = parts.join(" · ");
}

  if (!F.d.value) return toast("请填日期");
  if (!(c>0)) return toast("填一下人民币金额");

async function applyImport(obj, label){
  if (!obj || !Array.isArray(obj.records)) throw new Error("bad");
  const backup = { records: state.records.slice(), settings: { ...state.settings } };
  state.records = obj.records
    .filter(r => r && r.date && r.cny > 0)
    .map(r => ({ ...r, id: r.id || uid() }))
    .sort((a,b)=> a.date < b.date ? -1 : 1);
  if (obj.settings) state.settings = { ...state.settings, ...obj.settings };
  applyTheme(state.settings.theme);
  seg($("#baseCny"), $("#baseUsdt"), state.settings.base === "CNY");
  await persist(); $("#mData").classList.remove("open"); render();
  toast(`${label}${state.records.length} 笔`, "撤销", async ()=>{
    state.records = backup.records; state.settings = backup.settings;
    applyTheme(state.settings.theme); await persist(); render(); toast("已还原");
  });
}

  if (e.key === "Escape"){
    const open = document.querySelector(".modal.open");
    if (open) open.classList.remove("open");
    else if ($("#form").classList.contains("open")) closeForm();
  }
  if ((e.metaKey||e.ctrlKey) && e.key === "Enter" && $("#form").classList.contains("open"))
    $("#form").requestSubmit();
});
addEventListener("scroll", ()=> $("#hdr").classList.toggle("scrolled", scrollY > 90), { passive:true });

/* ═══════════ 图标兜底 ═══════════
   正常情况下用同目录的 icon-*.png。若只单独部署了 index.html（图标文件缺失），
   这里用 canvas 现画一个注入，保证不至于变成网页截图。 */
(function(){
  const probe = new Image();
  probe.onerror = () => {
    try{
      const draw = size => {
        const c = document.createElement("canvas"); c.width = c.height = size;
        const x = c.getContext("2d"), s = size/512;
        x.fillStyle = "#0E1013"; x.fillRect(0,0,size,size);
        x.save(); x.translate(size/2, size/2); x.rotate(-13*Math.PI/180);
        x.fillStyle = "#F7931A";
        x.font = `bold ${300*s}px "Helvetica Neue", Arial, Helvetica, sans-serif`;
        x.textAlign = "center"; x.textBaseline = "middle";
        x.fillText("B", 6*s, 0);
        x.fillRect(-94*s, -158*s, 34*s, 316*s);
        x.fillRect(-36*s, -158*s, 34*s, 316*s);
        x.restore();
        return c.toDataURL("image/png");
      };
      document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"],link[rel="manifest"]')
        .forEach(l => l.remove());
      const add = (rel, href, attrs={}) => {
        const l = document.createElement("link"); l.rel = rel; l.href = href;
        Object.entries(attrs).forEach(([k,v]) => l.setAttribute(k,v));
        document.head.appendChild(l);
      };
      const big = draw(512);
      add("icon", big, { type:"image/png", sizes:"512x512" });
      add("apple-touch-icon", draw(180));
      const mf = { name:"定投账本", short_name:"定投", start_url:"./", scope:"./",
        display:"standalone", orientation:"portrait", lang:"zh-CN",
        background_color:"#F5F4F1", theme_color:"#F5F4F1",
        icons:[{ src:big, sizes:"512x512", type:"image/png", purpose:"any maskable" }] };
      add("manifest", URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"})));
    }catch(e){}
  };
  probe.src = "icon-192.png";
})();

/* ═══════════ 启动 ═══════════ */
(async function init(){
  const saved = await store.load();
  if (saved){
    state.records = (saved.records||[]).map(r=>({ ...r, id: r.id||uid() })).sort((a,b)=> a.date<b.date ? -1 : 1);
    state.settings = { ...state.settings, ...(saved.settings||{}) };
  }
  applyTheme(state.settings.theme);
  seg($("#baseCny"), $("#baseUsdt"), state.settings.base === "CNY");
  paintTick(); render();
  await fetchFx();
  await fetchPrice();
  setInterval(fetchPrice, 60000);
  setInterval(fetchFx, 1800000);          // 汇率半小时一次足够
  document.addEventListener("visibilitychange", ()=>{ if (!document.hidden){ fetchFx(); fetchPrice(); } });
})();
</script>
